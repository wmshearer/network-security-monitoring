# TA_windows already ships INDEXED_EXTRACTIONS = XMLKV-WINEVT and the field
# aliases/lookups for XmlWinEventLog. This is used as-is, unchanged.
#
# What TA_windows does NOT provide, verified empirically before writing this:
# a TIME_PREFIX/TIME_FORMAT for the Security or PowerShell-Operational
# XmlWinEventLog sources. Only [source::XmlWinEventLog:Microsoft-Windows-
# Sysmon/Operational] in TA_windows's default props.conf carries one (keyed
# off Sysmon's own <Data Name='UtcTime'> EventData field, which Security and
# PowerShell events do not have). Without this, Security and PowerShell
# events fell back to index time (confirmed: a 20-line test oneshot on
# 2026-08-24 landed every event at _time = 2026-08-24 14:18:50, ~4 months
# off from the real 2026-04-24 SystemTime in the raw XML).
#
# Fix: key off <TimeCreated SystemTime='...'/>, which every Windows Event XML
# record has regardless of provider. Seven-digit fractional seconds
# (2026-04-24T10:34:55.5178180Z) confirmed present in this dataset and
# confirmed to parse correctly on this Splunk build (10.4.2) with %7N.
#
# A first version of this stanza (no TZ line) landed every Security/PowerShell
# event exactly 7 hours off from the real UTC time in the raw XML: TIME_FORMAT's
# literal "Z" is matched as a character, not interpreted as a UTC marker, so
# without an explicit TZ Splunk applied the search head's local zone (PDT,
# UTC-7) to a string that is actually UTC. Caught by SPL-based verification
# (comparing _time to a UTC-forced strptime of the raw string), not by eye:
# a PDT-labeled _time can look plausible and still be the wrong absolute
# instant. TZ = UTC below fixes it; re-verified as an exact match (see
# evidence/02_timestamp_verification.txt).
#
# Deployed to: /home/kali/splunk/etc/apps/ir_activemq_lockbit/local/props.conf
[source::XmlWinEventLog:Security]
TIME_PREFIX = <TimeCreated SystemTime='
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC

[source::XmlWinEventLog:Microsoft-Windows-PowerShell/Operational]
TIME_PREFIX = <TimeCreated SystemTime='
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC
