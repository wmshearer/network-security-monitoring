rules:
  - id: tool-dispatch-without-authz
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      Arguments parsed from a model-issued tool call are passed into a
      dynamically-selected tool implementation without first going through an
      authorization/policy check. An LLM agent's decision to call a tool (and
      the arguments it supplies) can be steered by anything the model has
      read, including an indirect prompt injection from a retrieved document
      or a tool result. OWASP LLM03:2026 Excessive Agency's top mitigation is
      to implement authorization in deterministic application logic, not to
      rely on the model to decide when a call is appropriate. Route the parsed
      arguments through an authorize()/permission-check call (and fail closed
      on denial) before invoking the tool implementation.
    metadata:
      cwe:
        - "CWE-862: Missing Authorization"
      owasp:
        - "LLM03:2026 Excessive Agency (was LLM06:2025 Excessive Agency)"
      references:
        - https://genai.owasp.org/llmrisk/llm03-excessive-agency/
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/tree/main/2026/final
      category: security
      confidence: MEDIUM
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      technology:
        - python
        - llm
        - agent
      note: >
        Intraprocedural only (Semgrep OSS limit): the taint source (parsed
        tool-call arguments) and the sink (the dynamic call site) must be in
        the same function. Separately, note the pattern-not-inside comment
        on the sink below: Semgrep taint-mode pattern-sanitizers only clear a
        variable that gets reassigned to a "clean" value, not a variable
        whose use is merely gated by an if/else after a bare authorization
        call, so this rule uses a structural exclusion instead of a taint
        sanitizer to avoid flagging the real target's correctly-authorized
        branch. That exclusion recognizes exactly one code shape (an
        authorize()-style call followed by the dispatch call in the same
        block) and may miss or misjudge differently structured checks.
    pattern-sources:
      - pattern: json.loads(...)
      - pattern: $CALL["function"]["arguments"]
    pattern-sinks:
      - patterns:
          - pattern: $IMPL(**$FNARGS)
          - focus-metavariable: $FNARGS
          # Semgrep taint-mode `pattern-sanitizers` only clear a variable when
          # the sanitizer pattern *reassigns* it (e.g. `x = sanitize(x)`); a
          # bare call like `authorize(...)` that just gates a branch via
          # if/else does not register as a sanitizer, so a naive
          # pattern-sanitizers entry here would falsely still flag the
          # correctly-authorized branch. Excluding call sites that are
          # textually preceded (in the same block) by an authorize() call
          # is how this rule actually gates on the real control-flow shape
          # in OSS. This is a structural workaround for a mode limitation,
          # not a taint sanitizer, and it only recognizes this one shape
          # (an authorize()-style call followed by the dispatch call in the
          # same block) -- a differently structured authz check may not be
          # recognized.
          - pattern-not-inside: |
              $DECISION = authorize(...)
              ...
