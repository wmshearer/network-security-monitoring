rules:
  - id: secret-in-system-prompt-reaches-reply
    mode: taint
    languages: [python]
    severity: INFO
    message: >
      SCOPE NOTE, READ BEFORE ACTING ON THIS FINDING: this rule can only see
      one half of the real vulnerability it is named for. The actual risk is
      a secret/config literal interpolated into a system prompt in one module
      (e.g. config.py) reaching a response returned to the caller in a
      different module/function (e.g. main.py's chat handler). Semgrep OSS
      taint mode is intraprocedural only (Semgrep's own docs: "Interprocedural
      taint analysis is a Semgrep Pro feature"), so this rule cannot trace
      that cross-file, cross-function path at all. What follows is scoped
      down to what OSS can actually check: a literal assigned directly to a
      variable that is f-string-interpolated into the same string used as a
      chat message's returned "content", within a single function. If your
      secret and your response-return live in different functions (the common
      case, and the case in this project's own target), THIS RULE WILL NOT
      FIRE ON THAT FLOW. Use Semgrep Pro's interprocedural taint mode, or a
      manual/LLM-assisted review, to check the real cross-file flow. Do not
      treat a clean run of this rule alone as evidence the secret cannot leak.
    metadata:
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp:
        - "LLM08:2026 Hidden Context Exposure (was LLM07:2025 System Prompt Leakage)"
      references:
        - https://genai.owasp.org/llmrisk/llm08-hidden-context-exposure/
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/tree/main/2026/final
        - https://semgrep.dev/docs/writing-rules/data-flow/taint-mode
      category: security
      confidence: LOW
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      technology:
        - python
        - llm
      note: >
        DELIBERATELY LIMITED SCOPE. This rule only demonstrates the
        single-function case, which is not the shape of the real
        vulnerability in this project's target (config.py's CANARY_SECRET
        reaches main.py's reply return across two files and multiple
        function calls). It is included to show, honestly, where OSS
        detection for this vulnerability class stops. Confirming the real
        cross-file flow requires Semgrep Pro's interprocedural taint engine.
    pattern-sources:
      - patterns:
          - pattern: '$SECRET = "..."'
          - metavariable-regex:
              metavariable: $SECRET
              regex: "(?i)(secret|token|api_key|password|credential|canary)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: return $RESP(reply=$SINK, ...)
              - pattern: 'return {"reply": $SINK, ...}'
          - focus-metavariable: $SINK
