rules:
  - id: untrusted-retrieval-into-prompt
    mode: taint
    languages: [python]
    severity: WARNING
    message: >
      Text returned from a retrieval/RAG lookup is concatenated into an LLM
      message body without going through a delimiting, escaping, or
      provenance-tagging step first. Retrieved documents are attacker-reachable
      in most RAG deployments (anyone who can get content into the corpus, or
      compromise a source the corpus indexes, controls this text). Mixed
      untagged into the same message the model treats as instructions, this is
      the classic indirect prompt injection setup: the model has no structural
      signal that this text is "reference data" rather than "things to obey."
      Wrap retrieved content in an explicit, consistently-applied delimiter or
      data-marking scheme (OWASP LLM01:2026 mitigation #6) and keep it out of
      the instruction channel, or treat it as untrusted input and re-validate
      any instruction-like content it contains before use.
    metadata:
      cwe:
        - "CWE-1426: Improper Validation of Generative AI Output"
      owasp:
        - "LLM01:2026 Prompt Injection"
      references:
        - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/tree/main/2026/final
      category: security
      confidence: MEDIUM
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      technology:
        - python
        - llm
        - rag
      note: >
        Intraprocedural only (Semgrep OSS limit). This rule only sees a source
        and sink inside the same function. If a project's retrieval call and
        its message-assembly step live in different functions, this rule will
        not connect them; that requires Semgrep Pro's interprocedural taint
        analysis.
    pattern-sources:
      - pattern: retrieve(...)
      - pattern: $DOC.text
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '{"role": "user", "content": $SINK}'
              - pattern: '{"role": "system", "content": $SINK}'
          - focus-metavariable: $SINK
      - patterns:
          - pattern: f"...{$SINK}..."
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: sanitize_retrieved_text(...)
      - pattern: escape_untrusted(...)
