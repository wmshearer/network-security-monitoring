rules:
  - id: unchecked-path-to-file-read
    mode: taint
    languages: [python]
    severity: INFO
    message: >
      SCOPE NOTE, READ BEFORE ACTING ON THIS FINDING: this rule can only
      check a path-read call and any containment check that appear in the
      SAME function. The realistic version of this vulnerability has the
      path parameter accepted in one function (e.g. a tool implementation
      like read_file()) and the containment/allow-list check enforced by a
      caller in a different function or module (e.g. an authz layer invoked
      from the agent's dispatch loop before the tool runs). Semgrep OSS taint
      mode cannot see across that call boundary ("Interprocedural taint
      analysis is a Semgrep Pro feature" per Semgrep's own docs), so a tool
      function that itself does no validation will always look unchecked to
      this rule, REGARDLESS of whether a caller elsewhere already enforced
      containment. In this project's own target, that is exactly the real
      shape: tools.py's read_file() takes a raw path with no check of its
      own, and the actual containment check lives in authz.py, called from
      main.py, neither of which read_file() itself references. Expect this
      rule to fire on every tool function that reads by path and validates
      nothing locally, whether or not the overall system is actually safe.
      Use Semgrep Pro's interprocedural taint mode, or manual review of the
      call sites, to determine whether an external check actually gates the
      call before treating a finding here as a confirmed vulnerability.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "LLM03:2026 Excessive Agency (was LLM06:2025 Excessive Agency)"
      references:
        - https://genai.owasp.org/llmrisk/llm03-excessive-agency/
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/tree/main/2026/final
        - https://semgrep.dev/docs/writing-rules/data-flow/taint-mode
      category: security
      confidence: LOW
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      technology:
        - python
        - llm
        - agent
      note: >
        DELIBERATELY LIMITED SCOPE. Only sees a containment/normalization
        check if it happens inside the same function as the lookup. In this
        project's target the real containment check (authz.py's
        check_read_file, using PurePosixPath and .parents) is enforced by a
        caller in a different module entirely, so this rule cannot observe
        it and will flag tools.py's read_file() regardless of whether the
        caller gates it. That is intentional: it demonstrates the boundary
        rather than hiding it behind a rule that looks more capable than it
        is. Confirming whether a given path-accepting function is actually
        protected requires tracing its callers by hand or with Semgrep Pro.
        Also note: a bare `authorize(...)` call that only gates a branch via
        if/return, without reassigning the path variable to a "clean" value,
        does not register as a Semgrep taint-mode sanitizer at all (sanitizers
        only clear a variable that gets reassigned to match the sanitizer
        pattern). This rule uses a pattern-not-inside structural exclusion for
        that shape instead, which recognizes exactly one code layout (an
        authorize()/check_read_file() call followed by the lookup, textually
        in the same block) and can still miss a differently structured guard.
    pattern-sources:
      - patterns:
          - pattern: |
              def $FUNC(..., $PATH, ...):
                  ...
          - focus-metavariable: $PATH
          - metavariable-regex:
              metavariable: $PATH
              regex: "^(path|filepath|file_path|filename)$"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DICT.get($PATH)
              - pattern: open($PATH, ...)
          - focus-metavariable: $PATH
          - pattern-not-inside: |
              $DECISION = authorize(...)
              ...
    pattern-sanitizers:
      - pattern: _normalize_posix_path(...)
      - pattern: check_read_file(...)
