# Deployed to:
# /home/kali/splunkforwarder/etc/apps/splunk_ingest_pipeline_uf/local/outputs.conf
#
# Points this Universal Forwarder at the local indexer's cooked TCP
# receiving port (9997, enabled via
# /home/kali/splunk/etc/apps/splunk_ingest_pipeline/local/inputs.conf
# [splunktcp://9997]). Single-indexer lab, so no load-balancing group with
# multiple servers is meaningful here -- see README.md for why EVENT_BREAKER
# (set on the monitor inputs, not here) is still the correct thing to
# configure even though its actual load-distribution *benefit* needs >=2
# indexers to observe, which this lab does not have.
[tcpout]
defaultGroup = ingest_lab_indexers

[tcpout:ingest_lab_indexers]
server = 127.0.0.1:9997
