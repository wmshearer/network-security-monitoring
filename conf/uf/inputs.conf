# Deployed to:
# /home/kali/splunkforwarder/etc/apps/splunk_ingest_pipeline_uf/local/inputs.conf
#
# Monitors the two copies of Windows Security.json under
# /home/kali/director/projects/splunk-ingest-pipeline/data/uf_monitor/ and
# forwards each with an explicit sourcetype -- no reliance on Splunk's
# automatic sourcetype detection (a named anti-pattern in
# research/splunk-ingestion-practice.md: "leaving data on an
# auto-generated/default sourcetype").
#
# EVENT_BREAKER_ENABLE/EVENT_BREAKER live in props.conf (this UF's
# local/props.conf, keyed by sourcetype), NOT in inputs.conf -- confirmed by
# reading /home/kali/splunkforwarder/etc/system/README/props.conf.spec after
# a first attempt to set them here failed with "Invalid key in stanza
# [monitor://...]" on startup (see README.md's failures section). They are
# needed here because this is a Universal Forwarder: a UF cannot run the
# parsing pipeline (no SHOULD_LINEMERGE/LINE_BREAKER available to it), so
# without EVENT_BREAKER it streams undifferentiated byte chunks and
# event-boundary-aware round-robin load distribution across a receiving
# indexer tier is not possible. This is the one Magic-8-adjacent setting the
# existing splunk-detection-lab props.conf correctly does NOT have, because
# that project never had a forwarder in its pipeline.
#
# crcSalt = <SOURCE> on both stanzas: security_good.json and
# security_naive.json are byte-identical copies (same md5) by design, so the
# comparison in Phase 2 is a pure props.conf/sourcetype effect with no
# confound from different source bytes. Without crcSalt, Splunk's UF
# fishbucket CRC check (first 256 bytes, by default) treated the second file
# as an already-seen duplicate of the first and silently never read it --
# confirmed in splunkd.log: security_good.json logged "Batch input finished
# reading" but security_naive.json never did, despite both being watched
# (see README.md's failures section). <SOURCE> salts the CRC with the full
# file path so two identical-content files are tracked independently.
[monitor:///home/kali/director/projects/splunk-ingest-pipeline/data/uf_monitor/security_good.json]
disabled = false
sourcetype = ingest_lab:security:json
index = ingest_lab
crcSalt = <SOURCE>

[monitor:///home/kali/director/projects/splunk-ingest-pipeline/data/uf_monitor/security_naive.json]
disabled = false
sourcetype = ingest_lab:security:json_naive
index = ingest_lab_naive
crcSalt = <SOURCE>
