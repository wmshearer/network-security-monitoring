# macros.conf for cloud-detection-lab Phase 2, deployed to
# /home/kali/splunk/etc/apps/cloud_detection_lab/local/macros.conf
#
# One initially-empty filter macro per detection, the same pattern used by
# all 318 of Splunk's own security_content cloud detections (see
# research/cloud-detection-methodology.md): a named, empty SPL macro at the
# end of every detection search, so a deploying organization can add
# site-specific allowlist exclusions (a known automation account, a CI/CD
# principal, a known-benign IP range) without editing the detection's own
# search logic. Each macro here is a literal no-op (`search *`, matches
# everything, changes nothing) until a site fills it in.
#
# Without these stanzas defined, every detection's search would error when
# run directly in Splunk (an undefined macro reference is a hard search
# error, not a silent no-op) -- this file is what makes every search in
# detections/spl/*.yml actually runnable against this Splunk instance, not
# just runnable through src/score_detections.py's stripped-down scoring
# form (which drops the macro line entirely, see that script's docstring).

[aws_cloudtrail_stop_delete_disable_logging_filter]
definition = search *
iseval = 0

[aws_console_login_multiple_failures_filter]
definition = search *
iseval = 0

[aws_iam_accessdenied_burst_filter]
definition = search *
iseval = 0

[aws_iam_policy_deleted_filter]
definition = search *
iseval = 0

[aws_new_mfa_device_registered_filter]
definition = search *
iseval = 0

[aws_s3_bucket_made_public_filter]
definition = search *
iseval = 0

[azure_ad_mfa_denied_burst_filter]
definition = search *
iseval = 0

[azure_ad_password_spray_filter]
definition = search *
iseval = 0

[azure_ad_privileged_role_assigned_filter]
definition = search *
iseval = 0

[o365_exchange_management_role_assigned_filter]
definition = search *
iseval = 0

[o365_mailbox_forwarding_rule_created_filter]
definition = search *
iseval = 0

[o365_service_principal_created_filter]
definition = search *
iseval = 0
