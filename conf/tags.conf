# tags.conf for cloud-detection-lab, deployed to
# /home/kali/splunk/etc/apps/cloud_detection_lab/local/tags.conf
#
# Applies the tag combination the Change data model's Auditing_Changes
# dataset requires (tag=change from All_Changes's own base constraint, plus
# tag=audit from Auditing_Changes -- both read directly from
# /home/kali/splunk/etc/apps/Splunk_SA_CIM/default/data/models/Change.json,
# not recalled from memory) to the eventtypes defined in this app's
# eventtypes.conf. All three cloud sourcetypes get the same tag pair because
# all three are audit-trail/management-activity logs, the exact case
# Auditing_Changes exists for (see README.md for the full model-fit
# reasoning, carried from research/splunk-cloud-ingestion.md).

[eventtype=cloud_lab_aws_cloudtrail]
change = enabled
audit = enabled

[eventtype=cloud_lab_azure_monitor_aad]
change = enabled
audit = enabled

[eventtype=cloud_lab_o365_management]
change = enabled
audit = enabled
