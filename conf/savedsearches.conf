[D6 - PowerShell Spawning Discovery or Scheduling Tool (T1059.001)]
description = Sysmon EventID 1 where ParentImage is powershell.exe and the child is net.exe/net1.exe/schtasks.exe. Deliberately CROSS-CUTTING (unlike D1-D5, which each target one capture/technique): this parent-child pattern is the common enabling behavior (PowerShell, ATT&CK T1059.001) behind 3 of the 5 Empire captures. Verified: fires on all 3 intended captures (empire_schtasks_creation_standard_user, empire_shell_net_localgroup_administrators, empire_shell_net_local_users), 0 false positives against the benign baseline (zero PowerShell-parented process creations of any kind in that capture window).
search = index=detection_lab EventID=1 ParentImage="*powershell.exe" (Image="*\\net.exe" OR Image="*\\net1.exe" OR Image="*\\schtasks.exe") | eval mitre_technique="T1059.001", detection_name="D6_powershell_spawns_recon_tool"
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 1
alert.digest_mode = 0
counttype = number of events
relation = greater than
quantity = 0
action.logevent = 1
action.logevent.param.source = detection_lab_alerts
action.logevent.param.index = detection_lab_alerts
action.logevent.param.sourcetype = detection_lab_alert
action.logevent.param.event = detection=D6_powershell_spawns_recon_tool technique=T1059.001 search_name="$name$" result_count=$job.resultCount$ sid="$job.sid$"
