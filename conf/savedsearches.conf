action.logevent.param.sourcetype = detection_lab_alert
action.logevent.param.event = detection=D4_net_user_enumeration technique=T1087.001 search_name="$name$" result_count=$job.resultCount$ sid="$job.sid$"
action.logevent.param.host = splunk-detection-lab

[D5 - Process Access to Audio Device Graph Isolation (T1123)]
description = Sysmon EventID 10 (ProcessAccess) where the TargetImage is AUDIODG.EXE (Windows Audio Device Graph Isolation, the process that owns microphone/audio handles). Maps to ATT&CK T1123 (Audio Capture). Verified: 74/74 matching events all in msf_record_mic (the only capture simulating audio/mic access), 0 false positives -- the 242,133-event benign baseline has ZERO Sysmon EventID 10 events targeting AUDIODG.EXE.
search = index=detection_lab EventID=10 TargetImage="*AUDIODG.EXE" | eval mitre_technique="T1123", detection_name="D5_process_access_audiodg"
