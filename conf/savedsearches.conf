# Detection saved searches for the splunk-detection-lab project.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_detection_lab/local/savedsearches.conf
#
# All 6 detections are saved searches, and all 6 are ALSO scheduled
# (enableSched=1) with a real alert action (`logevent`, Splunk-native, no
# paid app/license required) -- the task asked for "at least 3" scheduled
# with a real alert action; all 6 are scheduled here because every one of
# them depends on scheduled-search capability that disappears once this
# trial license lapses to Splunk Free (Free disables scheduled saved
# searches / alerting entirely) -- there is no reason to leave any of them
# unscheduled while the capability still exists.
#
# Each search targets the historical (2019-2022) event time range explicitly
# via dispatch.earliest_time/latest_time = 0/now rather than a relative
# "last 24 hours" window, because the underlying event timestamps are years
# in the past (see props.conf's MAX_DAYS_AGO note) -- a relative-time
# scheduled search over this dataset would find nothing every run, which
# would be a search-design bug, not evidence of "no attacks happened."
#
# alert.digest_mode=false so `sendalert logevent` fires once per matching
# result row rather than once per scheduled run -- makes it possible to
#1:1 verify "N events matched, N logevent alerts fired" in evidence/.

[D1 - Registry Run Key Persistence (T1547.001)]
description = Sysmon EventID 13 (registry SetValue) where the target is a named value under a CurrentVersion\\Run key. Maps to ATT&CK T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys). Verified against empire_persistence_registry_modification_run_keys_standard_user: 2/2 true positives, 0 false positives against the 242,133-event benign baseline (which has 11 Run-KEY CreateKey events but zero Run-VALUE SetValue events -- see FINDINGS.md).
search = index=detection_lab EventID=13 TargetObject="*\\Run\\*" | eval mitre_technique="T1547.001", detection_name="D1_registry_run_key_setvalue"
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 1
alert.digest_mode = 0
counttype = number of events
relation = greater than
quantity = 0
action.logevent = 1
action.logevent.param.source = detection_lab_alerts
action.logevent.param.index = detection_lab_alerts
action.logevent.param.sourcetype = detection_lab_alert
action.logevent.param.event = detection=D1_registry_run_key_setvalue technique=T1547.001 search_name="$name$" result_count=$job.resultCount$ sid="$job.sid$"
action.logevent.param.host = splunk-detection-lab

[D2 - Scheduled Task with Encoded PowerShell Payload (T1053.005)]
description = Sysmon EventID 1 (process creation) where schtasks.exe's command line references powershell AND a hidden window. Maps to ATT&CK T1053.005 (Scheduled Task/Job: Scheduled Task). Verified: 1/1 true positive against empire_schtasks_creation_standard_user, 0 false positives against the benign baseline (which has zero schtasks.exe process-creation events at all in this capture window).
search = index=detection_lab EventID=1 Image="*schtasks.exe" CommandLine="*powershell*" CommandLine="*hidden*" | eval mitre_technique="T1053.005", detection_name="D2_schtasks_encoded_powershell"
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 1
alert.digest_mode = 0
counttype = number of events
relation = greater than
quantity = 0
action.logevent = 1
action.logevent.param.source = detection_lab_alerts
action.logevent.param.index = detection_lab_alerts
action.logevent.param.sourcetype = detection_lab_alert
action.logevent.param.event = detection=D2_schtasks_encoded_powershell technique=T1053.005 search_name="$name$" result_count=$job.resultCount$ sid="$job.sid$"
action.logevent.param.host = splunk-detection-lab

[D3 - Local Administrators Group Enumeration (T1069.001)]
description = Sysmon EventID 1 where net.exe/net1.exe is invoked with "localgroup ... admin*". Maps to ATT&CK T1069.001 (Permission Groups Discovery: Local Groups). Verified: 1/1 true positive against empire_shell_net_localgroup_administrators (2 matching events: net.exe + its net1.exe child), 0 false positives against the benign baseline (zero net.exe/net1.exe process-creation events present at all).
search = index=detection_lab EventID=1 (Image="*\\net.exe" OR Image="*\\net1.exe") CommandLine="*localgroup*administ*" | eval mitre_technique="T1069.001", detection_name="D3_net_localgroup_administrators"
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 1
alert.digest_mode = 0
counttype = number of events
relation = greater than
quantity = 0
action.logevent = 1
action.logevent.param.source = detection_lab_alerts
action.logevent.param.index = detection_lab_alerts
action.logevent.param.sourcetype = detection_lab_alert
action.logevent.param.event = detection=D3_net_localgroup_administrators technique=T1069.001 search_name="$name$" result_count=$job.resultCount$ sid="$job.sid$"
action.logevent.param.host = splunk-detection-lab

[D4 - Local User Account Enumeration (T1087.001)]
description = Sysmon EventID 1 where net.exe/net1.exe is invoked with "user" but not "localgroup" (distinguishes account enumeration from group enumeration, D4 vs D3). Maps to ATT&CK T1087.001 (Account Discovery: Local Account). Verified: 1/1 true positive against empire_shell_net_local_users (2 matching events), 0 false positives, 0 cross-contamination with D3's capture.
search = index=detection_lab EventID=1 (Image="*\\net.exe" OR Image="*\\net1.exe") CommandLine="*user*" NOT CommandLine="*localgroup*" | eval mitre_technique="T1087.001", detection_name="D4_net_user_enumeration"
