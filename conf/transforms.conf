# transforms.conf for the splunk-detection-lab project.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_detection_lab/local/transforms.conf
#
# HONEST NOTE on why this file is nearly empty: the task asked for an
# explicit transforms.conf as part of "do not rely on automatic sourcetype
# detection" -- but this project's actual field-extraction mechanism is
# props.conf's `INDEXED_EXTRACTIONS = json` (see props.conf), which parses
# the JSON structure directly at index time and needs no transforms.conf
# stanza to produce `label`, `technique_id`, `EventID`, etc. as real indexed
# fields (verified: `index=detection_lab | stats count by label` works
# without any TRANSFORMS-* referencing this file -- see
# evidence/counts_by_label_capture.json). Declarative JSON-shape-driven
# extraction is the intentional design choice here, not an oversight this
# file was meant to compensate for.
#
# What IS handled here: the CIM-adjacent `EventType` field name collision
# discovered during detection development (see README.md's ingest section)
# -- Splunk's search-time layer treats `EventType`/`eventtype` as a reserved
# knowledge-object field name and silently returns empty for the JSON field
# of the same name rather than erroring (confirmed: `_raw` carries
# `"EventType": "SetValue"` but `| table EventType` returns nothing). Rather
# than silently losing that field, this stanza was written to rename it to
# `sysmon_event_type` at index time.
#
# CORRECTION 2026-08-23: IT DOES NOT WORK, and the honest record matters more
# than the tidy story. Verified directly:
#
#   index=detection_lab | stats count(sysmon_event_type), count
#   -> 0 populated out of 292,992 events
#
# Cause: `INDEXED_EXTRACTIONS = json` in props.conf handles parsing in the
# structured-data phase, which runs BEFORE and instead of the TRANSFORMS
# phase this stanza belongs to. The regex never sees the event. The stanza is
# syntactically fine and would work on a sourcetype that did not use
# INDEXED_EXTRACTIONS; here it is simply never reached.
#
# It is left in place, and this comment left with it, because the two settings
# genuinely conflict and the next person to combine them should find this
# written down rather than rediscover it. No detection in the project depends
# on it: they use EventID and TargetObject, which is why the failure went
# unnoticed.
[detection_lab_rename_event_type]
REGEX = "EventType"\s*:\s*"([^"]+)"
FORMAT = sysmon_event_type::$1
WRITE_META = true
