# CIM Endpoint data model mapping for splunk-detection-lab's existing
# `mordor:winlog:json` sourcetype/detection_lab index, done from THIS
# project's own app so splunk-detection-lab itself is not modified (per
# task constraint). Read-only against detection_lab's data; this app only
# adds search-time knowledge objects layered on top.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_ingest_pipeline/local/eventtypes.conf
#
# Splunk_SA_CIM's OWN eventtypes.conf (default/eventtypes.conf, read before
# writing this) ships only 3 eventtype stanzas, all internal to Splunk
# itself (err0r, cim_modaction, cim_modaction_invocation, plus two
# splunk_* internal ones) -- none reference a real data source. The CIM
# add-on supplies the schema (datamodels.conf, the field contract) but the
# actual sourcetype -> eventtype/tag mapping is left entirely to whoever
# onboards a given data source, which is what this file does.
#
# tag requirements per Endpoint.json object definitions (read from
# /home/kali/splunk/etc/apps/Splunk_SA_CIM/default/data/models/Endpoint.json
# -- the "comment.tags" list on each object is what its Pivot/datamodel
# search actually filters on):
#   Processes object requires: tag=process AND tag=report
#   Registry   object requires: tag=endpoint AND tag=registry
# (Sourced from the model file directly, not from memory of CIM field
# names, per the task instruction.)

[ingest_pipeline_sysmon_process_creation]
search = index=detection_lab sourcetype="mordor:winlog:json" EventID=1

[ingest_pipeline_sysmon_registry]
search = index=detection_lab sourcetype="mordor:winlog:json" (EventID=12 OR EventID=13 OR EventID=14)
