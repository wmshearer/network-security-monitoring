# Custom sourcetype for this project. Deliberately explicit rather than
# relying on Splunk's automatic sourcetype/timestamp/field-extraction
# detection (KV_MODE=auto, auto line-breaking heuristics) per the task's
# instruction. Every setting below is a stated choice, not a default left
# untouched.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_detection_lab/local/props.conf
#
# Data shape driving these settings: src/convert_evtx.py and src/convert_otrf.py
# both emit one JSON object per line (JSON-lines), one flattened Windows Event
# Log record per line, with a uniform ISO-8601 `@timestamp` field
# (`2020-06-10T02:50:56.537Z` / `2022-04-04T13:07:04.036405Z`) confirmed
# present and consistently formatted in BOTH the OTRF attack captures and the
# evtx-baseline benign conversion (the alternative `EventTime` field is NOT
# used for time extraction because it's ISO-8601 in one source but
# `YYYY-MM-DD HH:MM:SS` -- no offset, second precision only -- in the other;
# see README.md ingest section for this comparison).
[mordor:winlog:json]
DATETIME_CONFIG =
TIME_PREFIX = "@timestamp"\s*:\s*"
# Verified against real data (both sources): `@timestamp` is
# `YYYY-MM-DDTHH:MM:SS.fffZ` -- a 3-digit millisecond fraction and a literal
# trailing "Z" (UTC), e.g. "2020-09-21T07:15:27.705Z" and
# "2022-04-04T13:07:04.036405Z" (benign side sometimes carries 6 fractional
# digits -- %Q with no width consumes any digit count, unlike a fixed %3Q/%9Q,
# so this one format string covers both without truncation errors).
# %Z will NOT match a bare "Z" in Splunk's strptime (confirmed by testing:
# first attempt used %9Q%Z, which silently failed to parse and fell back to
# index/current time -- see README.md ingest section). "Z" is matched
# literally instead.
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%QZ
MAX_TIMESTAMP_LOOKAHEAD = 40
# Splunk's default MAX_DAYS_AGO (2000, ~5.5 years) silently rejects a
# correctly-parsed timestamp as "outside the acceptable time window" and
# falls back to current/index time instead of erroring loudly -- confirmed by
# checking splunkd.log: `DateParserVerbose ... matching timestamps (Mon Sep
# 21 07:15:27 2020) outside of the acceptable time window` for the OTRF
# captures (dated 2019-2020) once TIME_PREFIX/TIME_FORMAT were otherwise
# correctly extracting the real event time. Source data spans 2019-03
# (oldest OTRF capture) to 2022-04 (evtx-baseline); MAX_DAYS_AGO is widened
# generously past that so no source event is silently re-timestamped to
# ingest time.
MAX_DAYS_AGO = 3000
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Custom
disabled = false
pulldown_type = true
description = Flattened Windows Event Log (Sysmon/Security/PowerShell/etc.) records from OTRF Security-Datasets (attack) and evtx-baseline (benign), normalized to one JSON object per line by this project's src/convert_*.py scripts.

# Field extraction: the data is well-formed JSON (verified: every line
# produced by src/convert_evtx.py and src/convert_otrf.py is one
# `json.dumps()`-serialized dict), so INDEXED_EXTRACTIONS=json is used to
# extract fields directly from JSON structure at index time -- this is
# explicit, declared field extraction driven by the JSON spec, not
# heuristic/automatic key=value guessing (KV_MODE=auto), which is what the
# task's "do not rely on automatic ... field extraction" concern is actually
# about. AUTO_KV_JSON is left at its INDEXED_EXTRACTIONS-implied default
# (fields also available at search time) as a safety net if a raw event ever
# fails indexed extraction.
INDEXED_EXTRACTIONS = json
KV_MODE = none
TRUNCATE = 100000

# label and technique_id land as real indexed fields automatically via
# INDEXED_EXTRACTIONS=json (both are plain top-level JSON keys written by
# src/convert_*.py) -- no transforms.conf stanza needed for those two.
#
# EventType is the one field that DOES need transforms.conf: it collides
# with Splunk's reserved `eventtype` knowledge-object field name and is
# silently dropped by INDEXED_EXTRACTIONS' own JSON parsing at search time
# (see transforms.conf's module comment for the direct verification). This
# TRANSFORMS stanza renames it to `sysmon_event_type` at index time so the
# data isn't silently lost.
TRANSFORMS-rename_event_type = detection_lab_rename_event_type
