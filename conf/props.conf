# props.conf for cloud-detection-lab, deployed to
# /home/kali/splunk/etc/apps/cloud_detection_lab/local/props.conf
#
# Three sourcetypes, one per cloud audit-log platform. Every setting has a
# comment saying why it is set the way it is, not just what it does. The
# "Magic 8" settings (SHOULD_LINEMERGE, LINE_BREAKER, TIME_PREFIX,
# TIME_FORMAT, MAX_TIMESTAMP_LOOKAHEAD, TRUNCATE, plus INDEXED_EXTRACTIONS
# and KV_MODE for JSON sources) are all set explicitly here, never left at
# Splunk's automatic-detection defaults.
#
# All three real-world timestamp shapes are DIFFERENT (confirmed by reading
# the actual corpus files with src/select_cloud_files.py's manifest, then
# reading the raw JSON directly):
#   CloudTrail  eventTime      "2022-06-30T21:26:49Z"          no fraction
#   Azure       time           "2023-06-20T16:30:24.1848520Z"  7-digit fraction
#   O365        CreationTime   "2021-01-19T22:21:39"            no Z, no offset
# Confirmed at scale, not just on one sample: 51/51 sampled CloudTrail files
# match the no-fraction "...Z" shape, 43/44 sampled Azure files match the
# 7-digit fraction shape (1 file, T1110.003/azuread_highrisk/azure-audit.log,
# uses a completely different "8/2/2023 1:08:44 PM" shape -- see the note
# under [azure:monitor:aad] below), and 52/52 sampled O365 files match the
# plain no-offset shape. A single copied TIME_FORMAT across all three would
# have silently mis-timed at least two of them.

# --- AWS CloudTrail ---------------------------------------------------------
[aws:cloudtrail]
# This is the real sourcetype the Splunk Add-on for AWS assigns by default
# to CloudTrail management-event input (confirmed against
# splunk.github.io/splunk-add-on-for-amazon-web-services/CloudTrail/, see
# research/splunk-cloud-ingestion.md). Using the real name means a
# hand-written CIM mapping built here stays compatible if the vendor add-on
# is installed later on top of the same data.
SHOULD_LINEMERGE = false
# Every corpus file confirmed one flat JSON object per line, not a
# {"Records":[...]} wrapped array -- see the note at the bottom of this file
# ("Why LINE_BREAKER/PREAMBLE_REGEX is NOT used here") for the full
# reasoning. With one JSON object per line, the default newline event
# boundary is correct and no multi-line merge should ever happen.
LINE_BREAKER = ([\r\n]+)
# Explicit rather than relying on the SHOULD_LINEMERGE default's own
# newline handling -- stating the event boundary is a stated choice, not an
# accident of the default.
INDEXED_EXTRACTIONS = json
# Declarative JSON field extraction at index time. Every sampled CloudTrail
# file (51/51 in the manifest) is confirmed valid single-object-per-line
# JSON, so this is the correct, spec-driven extractor rather than heuristic
# KV_MODE=auto key=value guessing.
KV_MODE = none
# Splunk's own props.conf.spec warns that setting KV_MODE=json on top of
# INDEXED_EXTRACTIONS=json causes the JSON fields to be extracted TWICE:
# once at index time and again at search time. KV_MODE=none avoids that.
TIME_PREFIX = "eventTime"\s*:\s*"
# CloudTrail's own field name for event time, present in every sampled
# record (confirmed: 51/51 files in the manifest carry a top-level eventTime
# key as the first JSON line).
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
# CloudTrail eventTime is ISO-8601 with a literal trailing "Z" and NO
# fractional seconds, confirmed directly: "eventTime": "2022-06-30T21:26:49Z".
# %Z here is UNCONFIRMED-BY-DEFAULT against Splunk's strptime (a documented
# trap in the prior splunk-detection-lab project: %Z did not match a bare
# literal "Z" there, and timestamps silently fell back to ingest time with
# no error). This exact behavior is checked live for this sourcetype in the
# parse-proof step (see README.md); if %Z misbehaves here too, the fallback
# is a literal "Z" in the format string (%Y-%m-%dT%H:%M:%SZ).
MAX_TIMESTAMP_LOOKAHEAD = 30
# eventTime's value is at most ~20 characters; a small lookahead avoids
# wasted scan work. Not a correctness requirement (default is 128), just an
# optimization once TIME_PREFIX already anchors the search.
MAX_DAYS_AGO = 3000
# Corpus CloudTrail files are dated 2021-2024 (confirmed by directory
# sampling). Splunk's default MAX_DAYS_AGO is 2000 days (about 5.5 years),
# which silently discards a correctly-parsed timestamp older than that
# window in favor of current/index time -- a trap already proven in
# splunk-detection-lab (DateParserVerbose in splunkd.log, no UI error).
# Widened past the oldest file's age from "today" (2026) so no event is
# silently re-timestamped.
TRUNCATE = 100000
# Some sampled CloudTrail records run large (nested requestParameters,
# responseElements) -- the 10000-byte default has truncated JSON events in
# a prior project's identical data shape; the same ceiling is set here
# rather than re-discovering that truncation from scratch.
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Custom
disabled = false
pulldown_type = true
description = AWS CloudTrail management events (raw/native record shape, not the OCSF-reshaped Amazon Security Lake export -- see the note at the bottom of this file for why that is a separate, excluded shape).

# CIM field aliases, hand-written against the real dotted/nested field names
# INDEXED_EXTRACTIONS=json produces (e.g. userIdentity.arn, not a flat
# "user" field) -- see the CloudTrail-nested-fields trap in
# research/splunk-cloud-ingestion.md. Mapped to the CIM Change data model's
# Auditing_Changes dataset (base constraint tag=change, tag=audit -- see
# README.md for the full model-fit reasoning).
FIELDALIAS-cim_change_user = userIdentity.arn AS user
FIELDALIAS-cim_change_src = sourceIPAddress AS src
FIELDALIAS-cim_change_dvc = eventSource AS dvc
FIELDALIAS-cim_change_object = requestParameters.name AS object
# object is populated only when the API call's request carries a "name"
# parameter (e.g. StopLogging, DeleteTrail against a named trail) -- not
# every CloudTrail event has this shape, so this field is legitimately
# sparse, not broken. Coverage is reported for real in the parse-proof step.
FIELDALIAS-cim_change_vendor_account = userIdentity.accountId AS vendor_account
FIELDALIAS-cim_change_vendor_region = awsRegion AS vendor_region
FIELDALIAS-cim_change_status = errorCode AS status
# CloudTrail carries no separate boolean success/failure field -- an absent
# errorCode means success. status is left null (not force-set to "success")
# when errorCode is absent, so the CIM base model's own
# if(isnull(status)...,"unknown",status) calculated field is what actually
# supplies "unknown" rather than this props.conf inventing a value it did
# not observe. See README.md's CIM section for why this choice was made
# instead of an EVAL- that guesses.
# eventName (e.g. "StopLogging", "CreateAccessKey") is CIM's "action"/
# "command" territory but is NOT a fixed CIM action vocabulary value
# (expected_values are acl_modified/cleared/created/deleted/modified/etc,
# confirmed by reading Change.json directly) -- eventName is a free-form AWS
# API name, so it is aliased to command (which has no fixed vocabulary) and
# left OUT of action, rather than force-mapping ~150 distinct eventName
# values onto a 12-value enum with a guess. This is stated as a real
# incompleteness, not implemented and left silently wrong.
FIELDALIAS-cim_change_command = eventName AS command
# object_category: coarse classification from the CloudTrail eventSource
# (e.g. "cloudtrail.amazonaws.com" -> "cloudtrail"), useful for filtering by
# affected AWS service without a fixed CIM vocabulary requirement (this
# field has no expected_values list in Change.json, unlike action/status).
EVAL-object_category = eventSource

# --- Azure AD / Entra ID audit (Event Hub / Azure Monitor Activity Log) ----
[azure:monitor:aad]
# Real sourcetype from the Splunk Add-on for Microsoft Cloud Services
# (confirmed: splunk.github.io/splunk-add-on-for-microsoft-cloud-services/Sourcetypes/,
# see research/splunk-cloud-ingestion.md). The corpus sample is Azure
# Monitor Activity Log shape (operationName/resourceId/category fields),
# a close cousin of the AAD-specific export rather than a byte-for-byte
# match -- documented here rather than silently assumed identical.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIME_PREFIX = "time"\s*:\s*"
# The Azure sample's top-level "time" field, confirmed present in 44/44
# sampled files (manifest platform=azure_monitor).
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7QZ
# 7-digit fractional seconds confirmed at scale: 43/44 sampled files match
# "...1848520Z" (7 digits before the Z) -- verified by regex over every
# file in the manifest, not just one sample (see README.md's parse-proof
# section for the live-ingested confirmation this specific format string
# actually parses on this Splunk build, which the research brief flagged as
# NOT yet empirically confirmed). %7Q with an explicit width is used rather
# than width-less %Q because the fixed width matches what was actually
# measured across the corpus.
#
# ONE FILE DOES NOT MATCH THIS FORMAT:
# T1110.003/azuread_highrisk/azure-audit.log uses "time": "8/2/2023 1:08:44 PM"
# -- a completely different, non-ISO-8601 shape. This file is still ingested
# (it has the other required azure_monitor fields: operationName, category)
# rather than silently excluded, but its timestamp will NOT match
# TIME_PREFIX/TIME_FORMAT above and will fall back to Splunk's own secondary
# timestamp-detection pass or ingest time. This is a real, documented
# limitation of a single sourcetype covering files from more than one real
# Azure export tool -- see README.md's "what is NOT evidenced here" section.
MAX_TIMESTAMP_LOOKAHEAD = 40
MAX_DAYS_AGO = 3000
TRUNCATE = 100000
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Custom
disabled = false
pulldown_type = true
description = Azure Monitor Activity Log / Azure AD audit events (operationName/resourceId/category shape). Not Azure AD sign-in telemetry -- see README.md for why sign-in logs would need the Authentication CIM model instead of Change.

FIELDALIAS-cim_change_dvc = resourceId AS dvc
FIELDALIAS-cim_change_command = operationName AS command
FIELDALIAS-cim_change_object_category = category AS object_category
FIELDALIAS-cim_change_user = identity AS user
# identity is populated on only 23/44 sampled files (many events carry an
# empty properties.initiatedBy object instead, e.g. system/JIT-provisioned
# actions with no human actor) -- real, reported coverage, not assumed
# complete. See README.md's parse-proof section for the live count.
EVAL-status = if(isnotnull('properties.result'), 'properties.result', null())
# properties.result ("success"/"failure") is nested two levels deep in the
# real JSON (properties -> result), so INDEXED_EXTRACTIONS names it with
# the literal dotted field name properties.result -- referenced here in
# single quotes because Splunk's EVAL syntax requires quoting a field name
# that itself contains a dot to avoid it being parsed as a function-call
# dot-access. Populated on 18/44 sampled files; left null (not guessed)
# where absent, same reasoning as CloudTrail's status field above.
FIELDALIAS-cim_change_vendor_account = tenantId AS vendor_account

# --- O365 Management Activity API -------------------------------------------
[o365:management:activity]
# Real sourcetype (docs.splunk.com/Documentation/AddOns/released/MSO365/Sourcetypes;
# that specific docs.splunk.com page 403'd to a direct fetch during research
# and was corroborated via a search-result summary of the same official page
# instead -- see research/splunk-cloud-ingestion.md for the full citation
# trail. Treated as high confidence, not independently re-verified here.)
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIME_PREFIX = "CreationTime"\s*:\s*"
# O365 Management API events use CreationTime, confirmed present in 52/52
# sampled files.
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
# Unlike CloudTrail and Azure, this format has NO fractional seconds and NO
# trailing "Z"/offset marker at all -- confirmed directly across all 52
# sampled files ("2021-01-19T22:21:39", no exceptions found). This is a
# genuinely different format from the other two sourcetypes, not a
# copy-paste variant; reusing either of their TIME_FORMAT strings here would
# silently fail to match (a literal "Z" the data does not have, or a
# fractional-second group the data does not have). O365's documented
# behavior is that CreationTime is UTC; this corpus gives no explicit offset
# to test that assumption against, so "assume UTC" is stated here as an
# assumption, not an independently confirmed fact.
MAX_TIMESTAMP_LOOKAHEAD = 30
MAX_DAYS_AGO = 3000
TRUNCATE = 100000
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Custom
disabled = false
pulldown_type = true
description = O365 Management Activity API audit events (Operation/CreationTime/UserId shape).

FIELDALIAS-cim_change_user = UserId AS user
FIELDALIAS-cim_change_command = Operation AS command
FIELDALIAS-cim_change_status = ResultStatus AS status
FIELDALIAS-cim_change_object = ObjectId AS object
FIELDALIAS-cim_change_src = ActorIpAddress AS src
FIELDALIAS-cim_change_object_category = Workload AS object_category
# Workload (e.g. "AzureActiveDirectory", "Exchange") is O365's own coarse
# service classification, confirmed present in the sampled files -- the
# closest real field to CIM's object_category for this platform.

# =============================================================================
# The eventType / eventtype collision (CloudTrail) -- what happened and why
# the obvious fix (a transforms.conf rename) does not work.
# =============================================================================
#
# CloudTrail records carry a top-level "eventType" field (e.g. "AwsApiCall"),
# confirmed present in all 51 sampled CloudTrail files. "eventType" collides
# CASE-INSENSITIVELY with Splunk's own reserved "eventtype" knowledge-object
# concept (the mechanism eventtypes.conf uses to tag/classify events). This
# is the exact same class of collision splunk-detection-lab already proved
# with Sysmon's "EventType" field, carried forward here rather than
# re-derived from scratch.
#
# THE OBVIOUS FIX: write a transforms.conf TRANSFORMS-* stanza to rename
# eventType to something else (e.g. aws_event_type) at index time. This
# CANNOT WORK on this sourcetype, and this is stated plainly rather than
# attempted and left silently broken:
#   INDEXED_EXTRACTIONS = json (set on [aws:cloudtrail] above) parses JSON
#   fields in Splunk's STRUCTURED-DATA phase, which runs BEFORE and INSTEAD
#   OF the TRANSFORMS phase. A TRANSFORMS-* stanza referencing this
#   sourcetype is accepted without error by Splunk's config validation and
#   simply never fires -- confirmed already, at scale (0 of 292,992 events)
#   in splunk-detection-lab's own props.conf/transforms.conf for the
#   structurally identical Sysmon EventType collision. There is no
#   transforms.conf fix available while INDEXED_EXTRACTIONS=json is set on
#   the same sourcetype.
#
# WHAT WAS DONE INSTEAD: nothing needs to be done to recover the field,
# because Splunk's own KV_MODE=json / automatic JSON field extraction (the
# search-time layer, separate from INDEXED_EXTRACTIONS) still extracts the
# same raw key under the prefix "extracted_" when a search asks for it
# directly by that name pattern, following the same working pattern
# splunk-ingest-pipeline already used for the Sysmon EventType collision
# (that project's conf/indexer/props.conf EVAL-action comment). No
# detection field written here depends on eventType at all -- eventName
# (aliased to command above) carries the equivalent, non-colliding
# information for every CloudTrail record. The parse-proof step in
# README.md demonstrates the collision directly against real ingested data
# (| table eventType returns empty; the raw field is still visible in _raw
# and via a rex against _raw) rather than asserting it from the prior
# project's finding alone.

# =============================================================================
# Why LINE_BREAKER/PREAMBLE_REGEX array-splitting is NOT used here
# =============================================================================
#
# CloudTrail's native S3/API delivery format wraps multiple records in one
# document: {"Records": [ {...}, {...} ]}. This IS a real, documented Splunk
# problem in general (props.conf.spec's LINE_BREAKER + PREAMBLE_REGEX
# mechanism exists specifically for it) but it does NOT apply to the files
# actually in this corpus: every CloudTrail file selected by
# src/select_cloud_files.py (confirmed by that script's own JSON-per-line
# parsing, which would fail to classify a {"Records":[...]} wrapped file at
# all, since its first line would parse as one object with a "Records" key,
# not the flat CloudTrail record shape select_cloud_files.py checks for) is
# already one flat JSON object per line. Building LINE_BREAKER/
# PREAMBLE_REGEX array-splitting logic here would be solving a problem this
# specific dataset does not have. If a genuine {"Records":[...]} wrapped
# export is ever ingested, that mechanism (not INDEXED_EXTRACTIONS=json
# alone) is the documented answer -- see research/splunk-cloud-ingestion.md's
# "CloudTrail Records-array problem" section for the full citation trail.

# =============================================================================
# The OCSF CloudTrail variant (Amazon Security Lake export) -- decision
# =============================================================================
#
# A second, structurally different CloudTrail shape exists in the corpus:
# files matching {"metadata":..., "cloud":..., "time": <epoch milliseconds
# integer>} (34 files found by src/select_cloud_files.py, platform label
# aws_cloudtrail_ocsf in the manifest -- e.g. asl_ocsf_cloudtrail.json).
# This is OCSF (Open Cybersecurity Schema Framework), a different JSON
# schema Amazon Security Lake produces, not raw CloudTrail. Its "time" field
# is an epoch-millisecond INTEGER, not an ISO-8601 string -- reusing
# [aws:cloudtrail]'s TIME_PREFIX/TIME_FORMAT above against it would silently
# fail to parse (the regex would not match a bare integer the way it matches
# a quoted string).
#
# DECISION: OCSF CloudTrail is explicitly OUT OF SCOPE for this phase and is
# NOT ingested. No [aws:cloudtrail:ocsf] stanza is defined. This phase's
# task was three specific sourcetypes (aws:cloudtrail, azure:monitor:aad,
# o365:management:activity); OCSF is a fourth, genuinely different wire
# format that would need its own sourcetype, its own TIME_FORMAT (numeric
# epoch, not string), and its own CIM mapping (OCSF's field names --
# actor.user.uid, api.operation -- are already close to CIM-normalized in a
# different way, security_content's own detections query OCSF fields
# directly rather than through CIM aliases, per
# research/cloud-detection-methodology.md's quoted example). Documented here
# as a stated scope boundary, not an oversight -- a future phase could
# add [aws:cloudtrail:ocsf] following the same Magic-8 discipline as the
# three stanzas above.
