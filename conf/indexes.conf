# Dedicated index for this project. Do NOT ingest into `main` -- a shared
# default index makes retention, permissions, and search scoping someone
# else's problem later; a dedicated index keeps this project's data (and its
# eventual deletion) self-contained.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_detection_lab/local/indexes.conf
[detection_lab]
homePath   = $SPLUNK_DB/detection_lab/db
coldPath   = $SPLUNK_DB/detection_lab/colddb
thawedPath = $SPLUNK_DB/detection_lab/thaweddb
maxTotalDataSizeMB = 2048
# Source data is dated 2019-2022 (OTRF captures) and 2022 (evtx-baseline);
# Splunk's default frozenTimePeriodInSecs (~6 years) combined with default
# indexing would otherwise silently bucket/reject far-past-dated events in
# some configurations. Widened here so historical event timestamps are
# preserved and not overridden by index time.
maxHotSpanSecs = 7776000
frozenTimePeriodInSecs = 315360000

# Separate index for alert-action OUTPUT (the logevent records this
# project's 6 scheduled saved searches write when they fire), kept apart
# from `detection_lab` itself so "raw ingested telemetry" and "evidence that
# a detection fired" are never mixed in the same index/search scope --
# querying detection_lab_alerts alone is sufficient to prove the alerting
# pipeline ran, independent of the underlying event data.
[detection_lab_alerts]
homePath   = $SPLUNK_DB/detection_lab_alerts/db
coldPath   = $SPLUNK_DB/detection_lab_alerts/colddb
thawedPath = $SPLUNK_DB/detection_lab_alerts/thaweddb
maxTotalDataSizeMB = 512
