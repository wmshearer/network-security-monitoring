title: AWS Console Failed Login
name: aws_console_login_failure
id: 1f9d6e3a-7b2c-4a91-8e5d-6c1a9f2b3d44
status: experimental
description: |
    Base event rule: one failed AWS console sign-in attempt
    (ConsoleLogin, responseElements.ConsoleLogin=Failure). Paired with the
    correlation rule below (aws_console_login_multiple_failures-correlation)
    which raises this to a detection only once the same userName fails more
    than 5 times in 10 minutes, consistent with password guessing or a
    password-spray attempt run against a single account. This two-document
    shape (base rule + `type: event_count` correlation) is Sigma's current,
    non-deprecated way to express a threshold/aggregation detection; the
    older `| count() by ... > N` pipe syntax used in an earlier draft of
    this rule is deprecated and rejected by pySigma 1.5.0's parser, caught
    live while converting this rule with `sigma convert` (see README.md).
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: cloud-detection-lab
date: 2026-08-24
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: signin.amazonaws.com
        eventName: ConsoleLogin
        responseElements.ConsoleLogin: Failure
    condition: selection
falsepositives:
    - A user who genuinely forgot their password and retried manually.
    - Automated health-check or monitoring tooling that authenticates with
      a stale credential and retries on a fixed schedule.
level: low
tags:
    - attack.credential-access
    - attack.t1110.003
---
title: AWS Console Multiple Failed Logins for One User
id: 2a0e7f4b-8c3d-4b95-9f6e-7d2a0c3e4b55
status: experimental
correlation:
    type: event_count
    rules:
        - aws_console_login_failure
    group-by:
        - userIdentity.userName
    timespan: 10m
    condition:
        gt: 5
level: medium
