# ZAP Automation Framework plan: authenticated scan of the local Juice Shop
# container only. A bearer JWT (obtained by 02_register_and_login.py) is
# injected on every request via a replacer rule, so ZAP crawls and attacks
# as a logged-in user instead of an anonymous visitor.
#
# __TOKEN__ is substituted by 04_run_zap_auth.py just before this plan runs.
# The rendered file (with the real token) is written to auth-plan.rendered.yaml,
# which is gitignored so a live token is never committed.
env:
  contexts:
    - name: "juiceshop-auth"
      urls:
        - "http://127.0.0.1:3000"
      includePaths:
        - "http://127.0.0.1:3000.*"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "inject bearer token for authenticated scan"
        url: "http://127.0.0.1:3000.*"
        matchType: "REQ_HEADER"
        matchString: "Authorization"
        replacementString: "Bearer __TOKEN__"
        tokenProcessing: false

  - type: spider
    parameters:
      context: "juiceshop-auth"
      url: "http://127.0.0.1:3000"
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: activeScan
    parameters:
      context: "juiceshop-auth"
      url: "http://127.0.0.1:3000"
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 8

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/home/kali/director/projects/webapp-scanner-coverage/evidence/zap-auth"
      reportFile: "zap-auth-report"
      reportTitle: "Juice Shop authenticated ZAP scan"

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/home/kali/director/projects/webapp-scanner-coverage/evidence/zap-auth"
      reportFile: "zap-auth-report"
      reportTitle: "Juice Shop authenticated ZAP scan"
