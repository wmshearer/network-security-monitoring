# ZAP Automation Framework plan: unauthenticated scan of the local Juice Shop
# container only. Spider then active scan, then dump alerts to JSON.
env:
  contexts:
    - name: "juiceshop-unauth"
      urls:
        - "http://127.0.0.1:3000"
      includePaths:
        - "http://127.0.0.1:3000.*"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: "juiceshop-unauth"
      url: "http://127.0.0.1:3000"
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: activeScan
    parameters:
      context: "juiceshop-unauth"
      url: "http://127.0.0.1:3000"
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 8

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/home/kali/director/projects/webapp-scanner-coverage/evidence/zap-unauth"
      reportFile: "zap-unauth-report"
      reportTitle: "Juice Shop unauthenticated ZAP scan"

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/home/kali/director/projects/webapp-scanner-coverage/evidence/zap-unauth"
      reportFile: "zap-unauth-report"
      reportTitle: "Juice Shop unauthenticated ZAP scan"
