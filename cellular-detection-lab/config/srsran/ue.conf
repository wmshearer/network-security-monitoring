#####################################################################
#                   srsUE configuration file - this lab
#
# Simulated LTE handset for the 4G/LTE tier, running as a plain host
# process (build/srsRAN_4G/build/srsue/src/srsue - gitignored, see
# docs/4G-TIER.md/NOTES.md for the build). Talks to srsenb
# (config/srsran/enb.conf) over a ZMQ virtual radio - NO RF hardware, NO
# SDR, nothing transmitted over the air; the "radio interface" between
# the two processes is a pair of loopback TCP sockets carrying baseband
# I/Q samples, exactly the same "sockets standing in for radio" property
# every other simulated radio interface in this lab (5G tier's UERANSIM
# UDP socket, 2G tier's Virtual Um GSMTAP multicast) already has.
#####################################################################
[rf]
freq_offset = 0
tx_gain = 80
rx_gain = 40

device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://localhost:2000,id=ue,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 3350

#####################################################################
# Packet capture - NAS-EPS pcap gives Wireshark-decodable evidence of
# the Attach Request/Authentication/Security Mode/Attach Accept exchange
# directly from srsue, in addition to the Docker-bridge tshark capture
# used elsewhere in this lab (see docs/4G-TIER.md for which capture is
# used for what evidence).
#####################################################################
[pcap]
enable = nas
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

#####################################################################
# USIM configuration - this lab's synthetic 4G test subscriber
# (scripts/provision-subscriber-4g.js), same K/OPc convention as the
# lab's 5G subscriber, IMSI on the 3GPP-reserved test PLMN 999/70. NOT a
# real SIM, NOT a real carrier's key material.
#####################################################################
[usim]
mode = soft
algo = milenage
opc  = E8ED289DEBA952E4283B54E88E6183CA
k    = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000099
imei = 353490069873319

#####################################################################
# NAS configuration
#
# force_imsi_attach = true: this UE ALWAYS performs an Attach with its
# permanent identity (IMSI), never a stored GUTI - deliberately chosen
# so every run of this tier reproduces the exact identity-exposure
# question docs/4G-TIER.md exists to answer (3GPP TS 24.301's own
# specified case for a cleartext-IMSI Attach Request: "the UE has no
# valid GUTI" - forcing that case here, rather than relying on it only
# happening by accident on a UE's literal first-ever boot, the same
# choice this lab's 2G tier makes explicit in its own NOTES.md).
#####################################################################
[nas]
apn = internet
force_imsi_attach = true

