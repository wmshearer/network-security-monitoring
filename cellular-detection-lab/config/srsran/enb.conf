#####################################################################
#                   srsENB configuration file - this lab
#
# eNodeB for the 4G/LTE tier, running as a plain host process (srsRAN_4G
# built from source into build/srsRAN_4G/build/ - gitignored, see
# docs/4G-TIER.md and NOTES.md for the build). Connects to the Open5GS
# MME container (o5gs-mme, 172.22.0.24 on the cellular-detection-lab_core
# Docker bridge, 172.22.0.0/24) over plain SCTP - the same bridge network
# already used by the 5G tier's UERANSIM containers. This host is already
# attached to that bridge as 172.22.0.1 (br-89d61b12981f), so no extra
# routing is needed.
#
# NO RF HARDWARE: [rf] below uses srsRAN's "zmq" virtual radio driver -
# I/Q samples travel over a ZeroMQ TCP socket on loopback (127.0.0.1),
# not any real antenna/SDR. This is the exact same "sockets standing in
# for a radio interface" property the 5G tier (UERANSIM/UDP) and the 2G
# tier (Virtual Um/GSMTAP-multicast) already have.
#####################################################################
[enb]
enb_id = 0x19B
mcc = 999
mnc = 70
mme_addr = 172.22.0.24
gtp_bind_addr = 172.22.0.1
s1c_bind_addr = 172.22.0.1
s1c_bind_port = 0
n_prb = 50

[enb_files]
sib_config = sib.conf
rr_config  = rr.conf
rb_config = rb.conf

#####################################################################
# RF configuration - ZMQ virtual radio, NO hardware, NO SDR, nothing
# transmitted over the air. tx_port/rx_port are plain loopback TCP
# sockets carrying baseband I/Q samples between this process and
# srsue (config/srsran/ue.conf) - the "radio interface" between the
# two is a socket pair on 127.0.0.1, exactly like the 5G tier's UDP
# socket between ueransim-gnb and ueransim-ue.
#####################################################################
[rf]
dl_earfcn = 3350
tx_gain = 80
rx_gain = 40

device_name = zmq
device_args = fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,id=enb,base_srate=23.04e6

#####################################################################
# Packet capture - S1AP pcap gives Wireshark-decodable evidence of the
# eNB<->MME control plane directly from srsenb, no separate tshark
# capture point needed to get S1AP frames (a Docker bridge capture, as
# used elsewhere in this lab, still separately captures NAS-EPS/S1AP
# together - see docs/4G-TIER.md for which pcap is used for what).
#####################################################################
[pcap]
enable = false
# s1ap_enable left OFF: srsenb's own S1AP pcap writer produced a
# continuous "Error: Can't write to empty file handle" (lib/src/common/
# pcap.c) that turned out to be unrelated, cosmetic log noise once
# investigated (the file handle issue, not the S1AP connection itself -
# see NOTES.md) - this lab's Docker-bridge tshark capture
# (evidence/4g/lte-attach-capture.pcap) is the actual evidence source for
# S1AP/NAS-EPS, so this redundant capture path is simply left disabled.
s1ap_enable = false

[log]
all_level = info
all_hex_limit = 32
filename = /tmp/enb.log
file_max_size = -1

[gui]
enable = false
