! osmo-bsc config for the 2G tier - NULL-CIPHER variant (A5/0, the
! IMSI-catcher demo config).
! Base Station Controller: talks OML/RSL to osmo-bts-virtual, SCCP/M3UA
! to osmo-msc via osmo-stp, MGCP to osmo-mgw. Based on the package default
! /etc/osmocom/osmo-bsc.cfg (which itself already assumes an STP on
! 127.0.0.1 with default point codes - no explicit cs7 section needed).
!
! THIS VARIANT: "encryption a5 0" - permits ONLY A5/0 (null cipher, i.e.
! no encryption at all). This is the textbook IMSI-catcher configuration
! choice: GSM has no mutual authentication (the network never proves its
! identity to the handset), so the network can unilaterally pick A5/0 in
! the Ciphering Mode Command and the handset has no way to detect or
! refuse it, short of a user-visible "unencrypted call" indicator most
! phones do not surface. This is a CONFIGURATION CHOICE on OUR OWN
! network, observed from the inside - see ../../docs/DETECTION-SIGNALS.md
! signal #11. The only difference from osmo-bsc-a51.cfg is this single
! "encryption a5" line - that one-line diff producing the encrypted-vs-
! plaintext contrast on the wire is the finding.
!
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1

line vty
 no login
 bind 127.0.0.1
ctrl
 bind 127.0.0.1
!
e1_input
 e1_line 0 driver ipa
network
 network country code 001
 mobile network code 01
 encryption a5 0
 neci 1
 paging any use tch 0
 handover 0
 handover algorithm 1
 handover1 window rxlev averaging 10
 handover1 window rxqual averaging 1
 handover1 window rxlev neighbor averaging 10
 handover1 power budget interval 6
 handover1 power budget hysteresis 3
 handover1 maximum distance 9999
 ! T3212 is in units of 6min. Set to 1 (6min) rather than the
 ! shipped default of 5 (30min) so a periodic Location Update -
 ! specifically the "network forgot my TMSI, ask again" scenario used
 ! to demonstrate signal #12 (Identity Request) - completes in a bounded,
 ! practical test window instead of a half hour.
 timer net T3212 1
 mgw 0
  remote-ip 127.0.0.1
  remote-port 2427
  local-port 2727
 bts 0
  type osmo-bts
  band DCS1800
  cell_identity 1
  location_area_code 0x0001
  base_station_id_code 63
  ms max power 15
  cell reselection hysteresis 4
  rxlev access min 0
  radio-link-timeout 32
  channel allocator mode set-all ascending
  rach tx integer 9
  rach max transmission 7
  channel-description attach 1
  channel-description bs-pa-mfrms 5
  channel-description bs-ag-blks-res 1
  early-classmark-sending forbidden
  ipa unit-id 6969 0
  oml ipa stream-id 255 line 0
  codec-support fr
  gprs mode none
  trx 0
   rf_locked 0
   arfcn 871
   nominal power 23
   ! to use full TRX power, set max_power_red 0
   max_power_red 20
   rsl e1 tei 0
   timeslot 0
    phys_chan_config CCCH+SDCCH4
    hopping enabled 0
   timeslot 1
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 2
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 3
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 4
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 5
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 6
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 7
    phys_chan_config TCH/F
    hopping enabled 0
msc 0
 ! Do not allow emergency calls unless you can route them to real
 ! emergency services - this is a synthetic test network only.
 allow-emergency deny
bsc
 mid-call-timeout 0
