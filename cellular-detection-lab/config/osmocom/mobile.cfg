!
! OsmocomBB "mobile" (layer23) config for the 2G tier - the virtual
! handset attaching over Virtual Um (virtphy) with no radio hardware.
!
! IMPORTANT: this file's structure is a near-verbatim capture of this
! exact `mobile` binary's own "show running-config" output (configure
! the ms/test-sim/support values once interactively via VTY, then copy
! the running-config back out), NOT hand-written from the Virtual Um
! wiki's published mobile.cfg example. The wiki's file (and any
! hand-written OsmocomBB config with the same semantic content) does
! NOT parse against this build - see NOTES.md, "OsmocomBB built from
! source" addendum, for the full diagnosis. The parser is sensitive to
! exact line ORDERING and PRESENCE inside the "ms 1" node in ways not
! obvious from the VTY's own command-completion help, e.g. it rejects a
! file that adds an explicit "exit" after "test-sim" or removes lines
! (mncc-socket, c7-any-timeout, etc.) that a hand-trimmed version does
! not need functionally. Because of that fragility, this file is kept
! as close to the tool's own generated form as possible - values were
! changed (see below) but no lines were reordered or removed beyond
! what was already safe to drop (the verbose per-category "logging
! level" block, which is a logging cosmetic with no config-parsing
! implications, confirmed by testing before/after).
!
! Values changed from the tool's own defaults (everything else is the
! generated default, deliberately untouched):
!   - ms 1 / stick 871            - lock to this lab's ARFCN (osmo-bsc-a5*.cfg)
!   - ms 1 / test-sim / imsi      - 001010000000001 (3GPP test PLMN 001/01)
!   - ms 1 / test-sim / ki        - all-zero COMP128v1 key (synthetic, no
!                                    real credential - see algorithm note below)
!   - ms 1 / test-sim / rplmn     - 001 01 (registered PLMN = our test PLMN)
!   - ms 1 / test-sim /
!       hplmn-search              - everywhere (search all bands for home PLMN)
!   - ms 1 / shutdown             - "no shutdown" (power the MS on at start)
!
! Auth algorithm dead end, recorded (see NOTES.md for the full log): the
! Osmocom Virtual Um wiki's reference mobile.cfg uses "ki xor 00...00"
! (Osmocom's own non-3GPP-standard "XOR-2G" test algorithm), matched
! with "aud2g xor-2g" in osmo-hlr. That combination DID complete a
! Location Update - but only because this lab's osmo-msc.cfg originally
! shipped "authentication optional" (the package example's default), so
! authentication silently never ran and the mismatch was never
! exercised. Once "authentication required" was set (needed for signal
! #11 - ciphering cannot start without authentication deriving Kc first)
! every Location Update failed with GSM AUTH failure: mismatching SRES -
! this build's XOR-2G implementation and osmo-hlr's XOR-2G implementation
! do not agree bit-for-bit on the same all-zero Ki. Root cause not
! chased further (XOR-2G is an Osmocom-only test convenience, not a
! documented 3GPP algorithm, so there is no independent spec to check
! either side against). Fix: switched both sides to COMP128v1 (a real,
! specified 2G algorithm - "aud2g comp128v1" in osmo-hlr, "ki comp128"
! here), same all-zero synthetic key, which authenticates successfully.
!
! sim test / test-sim is the BUILT-IN SOFTWARE SIM emulation - required
! because virtphy implements no physical or virtual SIM card handling of
! its own (see ../../docs/2G-TIER.md). This build has no GPS/gpsd support
! compiled in (libgps-dev not installed, not needed here) - the "gps
! device"/"gps baudrate"/"no gps enable" top-level lines below are the
! tool's own generated no-op defaults for that, kept as-is.
!
!
!
log stderr blocking-io
 logging filter all 1
 logging color 1
 logging print category-hex 1
 logging print category 0
 logging print thread-id 0
 logging timestamp 0
 logging print file 1
 logging level rsl notice
 logging level rr notice
 logging level plmn notice
 logging level cs notice
 logging level nb notice
 logging level mm notice
 logging level cc notice
 logging level gcc notice
 logging level bcc notice
 logging level ss notice
 logging level sms notice
 logging level mncc notice
 logging level meas notice
 logging level pag notice
 logging level l1c notice
 logging level sap notice
 logging level sum notice
 logging level sim notice
 logging level gps notice
 logging level mob notice
 logging level prim notice
 logging level lua debug
 logging level gapk debug
 logging level csd debug
 logging level tun notice
 logging level rlcmac notice
 logging level llc notice
 logging level sndcp notice
 logging level gmm notice
 logging level sm notice
 logging level lglobal notice
 logging level llapd notice
 logging level linp notice
 logging level lmux notice
 logging level lmi notice
 logging level lmib notice
 logging level lsms notice
 logging level lctrl notice
 logging level lgtp notice
 logging level lstats notice
 logging level lgsup notice
 logging level loap notice
 logging level lss7 notice
 logging level lsccp notice
 logging level lsua notice
 logging level lm3ua notice
 logging level lmgcp notice
 logging level ljibuf notice
 logging level lrspro notice
 logging level lns notice
 logging level lbssgp notice
 logging level lnsdata notice
 logging level lnssignal notice
 logging level liuup notice
 logging level lpfcp notice
 logging level lcsn1 notice
 logging level lio notice
 logging level ltcap notice
!
stats interval 5
!
line vty
 no login
!
gps device /dev/ttyACM0
gps baudrate default
no gps enable
!
no hide-default
!
ms 1
 layer2-socket /tmp/osmocom_l2
 imei 000000000000000 0
 imei-fixed
 sim test
 test-sim
  imsi 001010000000001
  ki comp128 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 
  no barred-access
  rplmn 001 01
  hplmn-search everywhere
  no locigprs
 sap-socket /tmp/osmocom_sap
 mncc-socket /tmp/ms_mncc_1
 mncc-handler internal
 network-selection-mode auto
 no emergency-imsi
 no sms-service-center
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 stick 871
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  p-gsm
  e-gsm
  r-gsm
  er-gsm
  no gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  full-data-9600
  full-data-4800
  half-data-4800
  full-data-2400
  half-data-2400
  min-rxlev -106
  dsc-max 90
  no skip-max-per-band
  vgcs
  vbs
 c7-any-timeout 30
 uplink-release-local
 no asci-allow-any
 tch-voice
  io-handler none
 tch-data
  io-handler none
  io-tch-format osmo
  call-params type-rate 71
  call-params ce transparent
  call-params async
  call-params async nr-stop-bits 1
  call-params async nr-data-bits 8
  call-params async parity none
 no shutdown
!
gsmtap
 no remote-host
 no local-host
end
