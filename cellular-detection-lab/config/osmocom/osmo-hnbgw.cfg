!
! OsmoHNBGW config for the 3G tier.
! Home NodeB Gateway: terminates Iuh (HNBAP/RUA/RANAP over SCTP) from
! osmo-hnodeb, and relays Iu-CS/Iu-PS onward as SCCP/M3UA via osmo-stp
! to osmo-msc (Iu-CS) and osmo-sgsn (Iu-PS, not yet wired up in this
! build - see docs/3G-TIER.md). Based on the package's own
! doc/examples/osmo-hnbgw/osmo-hnbgw-cs7.cfg (build/osmo-hnbgw/doc/
! examples/), with real point codes substituted for the example's
! placeholder ones.
!
! DELIBERATELY SHARES cs7 instance 0 with the already-running 2G tier's
! osmo-stp/osmo-bsc/osmo-msc (see ../../docs/3G-TIER.md and NOTES.md for
! why: osmo-stp.cfg already has "xua rkm routing-key-allocation
! dynamic-permitted" + "accept-asp-connections dynamic-permitted" on
! instance 0, so a new ASP (this daemon) can register without any
! osmo-stp.cfg change or restart - no risk to the live 2G ASPs). Point
! code 0.42.0 is free: osmo-msc already holds 0.23.1, osmo-bsc holds
! 0.23.3 (both confirmed live via VTY before choosing this value).
!
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
 logging level set-all notice
!
line vty
 no login
 bind 127.0.0.1
ctrl
 bind 127.0.0.1
!
cs7 instance 0
 point-code 0.42.0
 asp asp-clnt-hnbgw-0 2905 0 m3ua
  remote-ip 127.0.0.1
  role asp
  sctp-role client
 sccp-address my-msc
  point-code 0.23.1
!
hnbgw
 plmn 001 01
 iuh
  local-ip 127.0.0.1
 mgw 0
  remote-ip 127.0.0.1
  local-port 2729
  remote-port 2427
  reset-endpoint rtpbridge/*
msc 0
 remote-addr my-msc
