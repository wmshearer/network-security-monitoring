!
! OsmoSTP config for the 2G tier (SCCP/M3UA transfer point between
! osmo-bsc and osmo-msc). Based on the package-shipped
! /etc/osmocom/osmo-stp.cfg default (which already works out of the box
! with no PLMN-specific values - STP only routes SCCP by point code, it
! has no knowledge of MCC/MNC/LAC at all).
!
log stderr
 logging filter all 1
 logging color 1
 logging print category 1
 logging timestamp 0
 logging level set-all notice
line vty
 no login
cs7 instance 0
 xua rkm routing-key-allocation dynamic-permitted
 listen m3ua 2905
  accept-asp-connections dynamic-permitted
