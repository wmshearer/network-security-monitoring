!
! OsmoMGW config for the 2G tier.
! Media Gateway: switches the RTP bearer plane for BSC/MSC-controlled
! calls. This lab never places a voice call (the milestone is a LOCATION
! UPDATE, not a call setup) so the MGW is present only because osmo-bsc
! and osmo-msc both expect one configured at startup (they connect to it
! via MGCP even if no call ever uses it) - a single shared osmo-mgw
! instance serves both, listening on the default MGCP port (2427) that
! both osmo-bsc.cfg and osmo-msc.cfg above already point their `mgw
! remote-ip`/`remote-port` at.
!
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1

line vty
 no login
 bind 127.0.0.1
!
mgcp
 bind ip 127.0.0.1
 bind port 2427
 rtp bind-ip 127.0.0.1
