!
! OsmoHNodeB config for the 3G tier - LEGITIMATE HNB.
! A software 3G Home NodeB: handles HNBAP/RUA/RANAP upper-layer
! signalling on the Iuh interface towards osmo-hnbgw. Its own README
! (build/osmo-hnodeb/README.md) states this is "a first step towards
! implementing a minimal hNodeB upper layer part... not expected to be
! a full/usable hNodeB anytime soon [if ever]" - the "ll-socket" (lower
! layer socket) below is the stub where a real Uu/PHY/RRC stack would
! attach; no such client exists anywhere in this build or upstream.
! This gives Iuh signalling only - no radio, no real handset, ever. See
! ../../docs/3G-TIER.md for the explicit RF-boundary statement.
!
! Based on the package's own doc/examples/osmo-hnodeb/osmo-hnodeb.cfg
! (build/osmo-hnodeb/doc/examples/), with test-PLMN 001/01 identity
! values matching this lab's 2G tier convention substituted for the
! example's placeholder ones.
!
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
 logging level set-all notice
!
line vty
 no login
 bind 127.0.0.1
!
hnodeb
 identity CellDetectLab-hNodeB-01
 network country code 001
 mobile network code 01
 cell_identity 1
 location_area_code 1
 routing_area_code 1
 service_area_code 1
 iuh
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
 ll-socket
  path /tmp/hnb_prim_sock
 gtp
  local-ip 127.0.0.3
