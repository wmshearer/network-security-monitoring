!
! OsmoHLR config for the 2G tier.
! Home Location Register: holds subscriber identity (IMSI/Ki) and serves
! GSUP to osmo-msc. Test PLMN 001/01 (3GPP-reserved test network, see
! ../../docs/2G-TIER.md) - the HLR itself is PLMN-agnostic (it just stores
! IMSI/Ki/APN records keyed by IMSI, same as the package default), no MCC/
! MNC config lives here.
!
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
 logging level main notice
 logging level db notice
 logging level auc notice
 logging level ss notice
 logging level linp error
!
line vty
 bind 127.0.0.1
ctrl
 bind 127.0.0.1
hlr
 gsup
  bind ip 127.0.0.1
 ussd route prefix *#100# internal own-msisdn
 ussd route prefix *#101# internal own-imsi
 ps
  pdp-profiles default
   profile 1
    apn internet
   profile 2
    apn *
