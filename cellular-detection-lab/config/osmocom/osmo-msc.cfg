!
! OsmoMSC config for the 2G tier.
! Mobile Switching Center: NAS/CC/MM signalling to the BSC over SCCP/M3UA
! (via osmo-stp), GSUP to osmo-hlr for subscriber auth data, and a media
! gateway (osmo-mgw) for the (unused, no voice calls in this lab) RTP
! bearer plane. Based on the package-shipped
! /usr/share/doc/osmo-msc/examples/osmo-msc/osmo-msc.cfg, only the PLMN
! and network naming were changed - EXCEPT for "authentication" and
! "encryption a5", changed deliberately from the shipped defaults (see
! below), which matter directly for signal #11 (docs/DETECTION-SIGNALS.md).
!
! "authentication required" (not the shipped default "optional") is
! REQUIRED for signal #11 to be observable at all: ciphering can only
! start after authentication derives Kc (the session key A5 uses) - per
! Osmocom's own docs, "the Kc resulting from authentication is the key
! used for ciphering". With "authentication optional" (confirmed by
! testing - see NOTES.md), this lab's test subscriber completed a full
! Location Update with NO Authentication Request and consequently NO
! Cipher Mode Command at all - there was nothing to observe. Real
! networks may also run "optional" for interop reasons, which is itself
! worth naming as a variant of the same underlying gap: skipping
! authentication (and therefore ciphering) entirely is a network-side
! choice a rogue/misconfigured cell can make, exactly like picking A5/0
! after authentication does run.
!
! "encryption a5" here is normally the BSC's job (it's the party that
! actually picks an algorithm the BTS supports and the MS accepts) - the
! MSC's own "encryption a5" line constrains which algorithms the MSC
! will even offer to the BSC as permitted in the first place, so it must
! match/be a superset of osmo-bsc-a5*.cfg's own "encryption a5" line.
! This file specifies "a5 0 1" (both permitted) rather than a single
! variant, so ONE msc config works for both the a50 and a51 BSC
! demonstrations - only the BSC-side config needs to switch to produce
! the null-cipher-vs-encrypted contrast (see osmo-bsc-a50.cfg /
! osmo-bsc-a51.cfg).
!
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1

line vty
 no login
 bind 127.0.0.1
ctrl
 bind 127.0.0.1
!
network
 network country code 001
 mobile network code 01
 short name CellDetectLab-2G
 long name CellDetectLab-2G-Test
 encryption a5 0 1
 authentication required
 rrlp mode none
 mm info 1
 mgw 0
  remote-ip 127.0.0.1
  remote-port 2427
  local-port 2728
msc
 assign-tmsi
 auth-tuple-max-reuse-count 3
 auth-tuple-reuse-on-error 1
