title: Azure AD Sign-in Failure, Invalid Username or Password
name: azure_ad_signin_invalid_credential
id: 9b6d4f23-5e9c-4a3b-8f1d-2c7e9b4a6d88
status: experimental
description: |
    Base event rule: one Azure AD sign-in failure with resultType 50126
    ("Invalid username or password"). Paired with the value_count
    correlation rule below (id a07c1e36-1b5d-6f80-c439-0a6e3f1b8e77),
    which raises this to a detection only when the same source IP produces
    failures against more than 5 DISTINCT identities in 10 minutes, the
    signature of a password-spray attempt (one or a small number of
    passwords tried across many accounts, rather than many passwords
    against one account). Counting distinct identity (value_count), not
    raw failure count, is what actually distinguishes a spray from one
    user mistyping their own password several times in a row.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: cloud-detection-lab
date: 2026-08-24
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        operationName: Sign-in activity
        resultType: '50126'
    condition: selection
falsepositives:
    - A shared corporate NAT/VPN egress IP where many real users
      legitimately mistype passwords around the same time.
level: low
tags:
    - attack.credential-access
    - attack.t1110.003
---
title: Azure AD Distributed Password Spray
id: a07c1e36-1b5d-6f80-c439-0a6e3f1b8e77
status: experimental
correlation:
    type: value_count
    rules:
        - azure_ad_signin_invalid_credential
    group-by:
        - callerIpAddress
    timespan: 10m
    condition:
        gt: 5
        field: identity
level: medium
