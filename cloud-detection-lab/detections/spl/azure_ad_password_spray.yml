name: Azure AD Distributed Password Spray
id: a07c1e36-1b5d-6f80-c439-0a6e3f1b8e77
version: 1
sigma_source: detections/sigma/azure_ad_password_spray.yml
status: experimental
description: >
    Detects more than 5 DISTINCT identities failing Azure AD sign-in with
    resultType 50126 ("Invalid username or password") from the same
    source IP in a 10-minute window, the signature of a password-spray
    attempt (one or a small number of passwords tried across many
    accounts, rather than many passwords against one account).
search: |-
    index=cloud_lab sourcetype="azure:monitor:aad"
      operationName="Sign-in activity" resultType="50126"
      | bin _time span=10m
      | stats dc(identity) as value_count by _time callerIpAddress
      | where value_count > 5
      | `azure_ad_password_spray_filter`
target_technique_id: T1110.003
target_dataset: T1110.003/azure_ad_distributed_spray/azure_ad_distributed_spray.log
mitre_attack_id:
    - T1110.003
known_false_positives: >
    A shared corporate NAT/VPN egress IP where many real users legitimately
    mistype passwords around the same time. This is a realistic false
    positive at any organization with a small number of egress IPs.
specificity_note: >
    Behavioral threshold on distinct-identity count per source IP, not a
    static field match. Fixed threshold (>5), not a learned baseline.
