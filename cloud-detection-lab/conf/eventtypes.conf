# eventtypes.conf for cloud-detection-lab, deployed to
# /home/kali/splunk/etc/apps/cloud_detection_lab/local/eventtypes.conf
#
# Splunk_SA_CIM's own eventtypes.conf ships only 3 internal stanzas (none
# reference a real data source, confirmed by reading
# /home/kali/splunk/etc/apps/Splunk_SA_CIM/default/eventtypes.conf directly,
# same finding splunk-ingest-pipeline already made for its own onboarding).
# The CIM add-on supplies the schema; mapping a real sourcetype onto it is
# left to whoever onboards that data source, which is what this file does.
#
# Change data model's base constraint is tag=change (Change.json, the
# All_Changes object's constraint). Auditing_Changes (the child dataset
# these three cloud platforms map onto) adds tag=audit on top of that
# (confirmed by reading Change.json directly, not from memory).

[cloud_lab_aws_cloudtrail]
search = index=cloud_lab sourcetype="aws:cloudtrail"

[cloud_lab_azure_monitor_aad]
search = index=cloud_lab sourcetype="azure:monitor:aad"

[cloud_lab_o365_management]
search = index=cloud_lab sourcetype="o365:management:activity"
