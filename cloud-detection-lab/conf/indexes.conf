# Dedicated index for this project, separate from every other index on this
# host. Only cloud_lab is created; main, history, summary, internal,
# detection_lab, detection_lab_alerts, ingest_lab, ingest_lab_naive are all
# left untouched per the task constraint.
#
# Deployed to: /home/kali/splunk/etc/apps/cloud_detection_lab/local/indexes.conf
[cloud_lab]
homePath   = $SPLUNK_DB/cloud_lab/db
coldPath   = $SPLUNK_DB/cloud_lab/colddb
thawedPath = $SPLUNK_DB/cloud_lab/thaweddb
maxTotalDataSizeMB = 2048
# Corpus files are dated 2021-2024 (confirmed by directory sampling); the
# default frozenTimePeriodInSecs (188697600, ~6 years) is close enough that
# it is widened here for the same reason MAX_DAYS_AGO is widened in
# props.conf -- avoid any silent edge-of-window behavior as the corpus or
# "today" ages.
maxHotSpanSecs = 7776000
frozenTimePeriodInSecs = 315360000
