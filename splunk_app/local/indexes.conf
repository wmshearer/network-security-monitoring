# Dedicated index for this project. New index, does not touch detection_lab,
# detection_lab_alerts, ingest_lab, ingest_lab_naive, or cloud_lab.
#
# Deployed to: /home/kali/splunk/etc/apps/ir_activemq_lockbit/local/indexes.conf
[ir_activemq_lockbit]
homePath   = $SPLUNK_DB/ir_activemq_lockbit/db
coldPath   = $SPLUNK_DB/ir_activemq_lockbit/colddb
thawedPath = $SPLUNK_DB/ir_activemq_lockbit/thaweddb
maxTotalDataSizeMB = 2048
# Source data is dated 2026-04-24. Default frozenTimePeriodInSecs/maxHotSpanSecs
# are fine for a single-day-old dataset, but widened defensively anyway since
# this environment's clock and the dataset's simulated date may not track
# exactly, and a bucket rollover mid-project would be an unwelcome surprise.
maxHotSpanSecs = 7776000
frozenTimePeriodInSecs = 315360000
