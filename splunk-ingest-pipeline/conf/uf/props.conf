# Deployed to:
# /home/kali/splunkforwarder/etc/apps/splunk_ingest_pipeline_uf/local/props.conf
#
# UF-side props.conf. EVENT_BREAKER_ENABLE/EVENT_BREAKER only, nothing else
# -- a Universal Forwarder does not run the parsing pipeline, so none of the
# other Magic 8 settings (SHOULD_LINEMERGE, LINE_BREAKER, TIME_PREFIX,
# TIME_FORMAT, MAX_TIMESTAMP_LOOKAHEAD, TRUNCATE) apply or are even
# recognized here; those are set once at the indexer
# (/home/kali/splunk/etc/apps/splunk_ingest_pipeline/local/props.conf) where
# actual parsing happens. EVENT_BREAKER's regex mirrors the indexer-side
# LINE_BREAKER (one JSON object per line) for consistency, but it does a
# different job: a lightweight boundary pass for even event distribution
# across indexers during transport, not the real line-breaking/parsing
# decision. Applied to BOTH sourcetypes, including the naive one -- this is
# a UF transport concern, not the indexer-side parsing anti-pattern
# ingest_lab:security:json_naive exists to demonstrate.
[ingest_lab:security:json]
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)

[ingest_lab:security:json_naive]
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)
