# props.conf for splunk-ingest-pipeline, deployed on the INDEXER
# (/home/kali/splunk/etc/apps/splunk_ingest_pipeline/local/props.conf).
#
# Two sourcetypes, deliberately contrasted:
#   [ingest_lab:security:json]        -- expert config, all Magic 8 settings
#                                         reasoned explicitly (see below)
#   [ingest_lab:security:json_naive]  -- everything left at Splunk's
#                                         automatic defaults, same source
#                                         data, for the Phase 2 comparison
#
# Data shape: data/uf_monitor/security_good.json and security_naive.json are
# both a copy of splunk-detection-lab's converted Windows Security.json
# (22,085 lines, one JSON object per line), read-only from that project. Same
# `@timestamp` ISO-8601 field convention documented in that project's
# props.conf, confirmed independently here: `2022-04-04T13:07:04.036405Z`,
# 6-digit fractional seconds (that project's own comment notes the benign
# side sometimes carries 6 digits vs 3 on the OTRF side -- this file, %Q with
# no fixed width, is unaffected by which one shows up).

[ingest_lab:security:json]
# --- Magic 8, reasoned for this sourcetype ---
DATETIME_CONFIG =
TIME_PREFIX = "@timestamp"\s*:\s*"
# Same reasoning as splunk-detection-lab/conf/props.conf: anchor on the
# unambiguous top-level @timestamp key rather than letting Splunk guess from
# EventTime (present here too, but not used, for the same cross-source
# format-consistency reason documented in that project).
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%QZ
# %Q (unbounded fraction width) + literal "Z" -- Splunk's strptime does not
# match a bare "Z" with %Z, this was the detection-lab project's own
# discovered failure mode, not repeated here.
MAX_TIMESTAMP_LOOKAHEAD = 40
MAX_DAYS_AGO = 3000
# Source capture is dated 2022; default MAX_DAYS_AGO (2000, ~5.5yr) would
# silently reject it as outside the acceptable window and fall back to
# index time. Same fix, same reasoning as detection-lab.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# JSON-lines: one full JSON object per line, no multi-line events to merge.
# Explicit LINE_BREAKER + SHOULD_LINEMERGE=false is still the documented
# correct default (see research/splunk-ingestion-practice.md) over relying
# on the auto line-merge heuristic, even though in this specific case a
# single-line-per-event format means the two approaches would likely agree;
# stating the boundary explicitly costs nothing and removes the guesswork.
TRUNCATE = 100000
# Detection-lab's props.conf found the 10000-byte default truncates its
# JSON events; this data is the same shape (flattened Windows event JSON
# with long fields like CommandLine), so the same ceiling is set here rather
# than re-discovering the same truncation bug from scratch.
NO_BINARY_CHECK = true
CHARSET = UTF-8
INDEXED_EXTRACTIONS = json
KV_MODE = none
category = Custom
disabled = false
pulldown_type = true
description = Windows Security.json (evtx-baseline benign capture), expert-configured sourcetype for splunk-ingest-pipeline's good-vs-naive comparison. All Magic 8 settings explicit.

# --- The deliberately BAD sourcetype for Phase 2's comparison ---
# Nothing set here beyond declaring the stanza and CHARSET/NO_BINARY_CHECK
# (needed so Splunk does not misdetect the file as binary -- without this
# the naive sourcetype fails to ingest at all rather than ingesting badly,
# which would not produce a comparable measurement). Everything that matters
# for parsing correctness -- SHOULD_LINEMERGE, LINE_BREAKER, TIME_PREFIX,
# TIME_FORMAT, MAX_TIMESTAMP_LOOKAHEAD, TRUNCATE -- is left at Splunk's
# built-in default, i.e. automatic line-merge heuristics and automatic
# timestamp discovery, exactly the anti-pattern the research file names.
[ingest_lab:security:json_naive]
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Custom
disabled = false
pulldown_type = true
description = Same Windows Security.json data as ingest_lab:security:json, but with NONE of the Magic 8 settings set -- Splunk's automatic line-breaking and timestamp detection are left in charge, for direct measurement against the expert-configured sourcetype above.

# --- Phase 4: CIM Endpoint mapping for splunk-detection-lab's EXISTING
# mordor:winlog:json sourcetype/detection_lab index, added here (this
# project's own app) rather than editing splunk_detection_lab, which is
# done and must not be touched. These are search-time FIELDALIAS/EVAL
# definitions layered on top of already-indexed data; nothing about
# detection_lab's indexing, storage, or its own props.conf changes.
#
# Field names on the right of each FIELDALIAS/EVAL are this project's own
# CIM field choices, taken directly from
# /home/kali/splunk/etc/apps/Splunk_SA_CIM/default/data/models/Endpoint.json
# (each object's "calculations" list; read before writing this, not
# recalled from memory -- see eventtypes.conf's comment for the exact
# per-object field lists pulled from that file).
[mordor:winlog:json]
# NOTE ON SHARING ONE STANZA ACROSS TWO CIM OBJECTS: mordor:winlog:json
# carries every Sysmon event type (process creation, registry activity, and
# others) in one sourcetype, keyed by EventID -- there is no separate
# sourcetype per Sysmon EventID to hang per-object FIELDALIAS lines on. A
# first attempt wrote two competing "FIELDALIAS-... = X AS process" lines
# (one from CommandLine for Processes, one from Image for Registry) in this
# same stanza; btool accepted it silently but Splunk's precedence between
# two FIELDALIAS attributes targeting the same output field in the same
# stanza is undefined/last-wins, not a real per-EventID branch. Fixed by
# using EVAL- with a case() on EventID for every field where Processes and
# Registry would otherwise collide (process, process_name, user is safe
# to alias directly since both objects use the same raw field for it).
FIELDALIAS-cim_endpoint_dest = Hostname AS dest
FIELDALIAS-cim_endpoint_user = User AS user

# --- Endpoint.Processes (Sysmon EventID=1, process creation) ---
# process is combined with the Registry object's equivalent below into one
# EVAL- statement (EventID==1 and EventID in 12/13/14 are mutually
# exclusive on any one event, so one case() safely covers both objects
# without collision). process_id/process_guid use the same raw ProcessId/
# ProcessGuid field name for both event types, so a plain FIELDALIAS covers
# both objects with no branching needed.
EVAL-process = case(EventID==1, CommandLine, in(EventID, 12, 13, 14), Image, 1==1, null())
EVAL-process_exec = if(EventID==1, Image, null())
EVAL-process_path = if(EventID==1, Image, null())
FIELDALIAS-cim_endpoint_process_id = ProcessId AS process_id
FIELDALIAS-cim_endpoint_process_guid = ProcessGuid AS process_guid
EVAL-parent_process = if(EventID==1, ParentCommandLine, null())
EVAL-parent_process_exec = if(EventID==1, ParentImage, null())
EVAL-parent_process_path = if(EventID==1, ParentImage, null())
EVAL-parent_process_id = if(EventID==1, ParentProcessId, null())
EVAL-parent_process_guid = if(EventID==1, ParentProcessGuid, null())
# process_name/parent_process_name are the CIM "friendly name, no path"
# calculated fields (e.g. sppsvc.exe, not C:\Windows\System32\sppsvc.exe);
# derived from Image/ParentImage since there is no separate raw field for
# just the executable's base name.
EVAL-process_name = if(EventID==1, replace(Image, "^.*\\\\", ""), null())
EVAL-parent_process_name = if(EventID==1, replace(ParentImage, "^.*\\\\", ""), null())

# --- Endpoint.Registry (Sysmon EventID=12/13/14, registry activity) ---
# TargetObject is the full registry path including the hive+key+value
# in one string (e.g. HKU\<sid>\...\Count\<value name>) -- Sysmon does not
# emit the key and value name as separate raw fields, so registry_path
# gets the full TargetObject and registry_key_name/registry_value_name
# are approximated by splitting on the last backslash. This is a real
# approximation, not an exact CIM-spec split, and is documented as such in
# FINDINGS.md rather than presented as precise.
EVAL-registry_path = if(in(EventID, 12, 13, 14), TargetObject, null())
EVAL-registry_key_name = if(in(EventID, 12, 13, 14), replace(TargetObject, "^(.*)\\\\[^\\\\]+$", "\1"), null())
EVAL-registry_value_name = if(in(EventID, 12, 13, 14), replace(TargetObject, "^.*\\\\([^\\\\]+)$", "\1"), null())
EVAL-registry_value_data = if(in(EventID, 12, 13, 14), Details, null())
# action: detection_lab's own props.conf/transforms.conf defines a
# TRANSFORMS-rename_event_type stanza meant to rename the raw JSON
# "EventType" key to sysmon_event_type at index time (its own transforms.conf
# module comment explains why: EventType collides with Splunk's reserved
# eventtype knowledge-object name). Verified directly against the live
# index rather than assumed: `index=detection_lab sysmon_event_type=*` and
# `index=detection_lab EventID=13 | stats count by sysmon_event_type` both
# return ZERO results -- the rename is not actually populating the field for
# ANY event in this index, a real gap in a project this task is not allowed
# to modify (see FINDINGS.md). extracted_EventType (Splunk's own automatic
# KV-JSON extraction of the same raw "EventType" key, confirmed present via
# `index=detection_lab (EventID=12 OR 13 OR 14) | stats count by EventID
# extracted_EventType`) is used here instead as a working substitute.
EVAL-action = case(extracted_EventType=="CreateKey", "created", extracted_EventType=="DeleteKey", "deleted", extracted_EventType=="DeleteValue", "deleted", extracted_EventType=="SetValue", "modified", 1==1, null())
# process/process_id/process_guid for Registry are covered by the combined
# EVAL-process case() and the plain process_id/process_guid FIELDALIAS
# above -- both objects share the same raw ProcessId/ProcessGuid field, and
# EVAL-process already branches on EventID to pick Image vs CommandLine.
