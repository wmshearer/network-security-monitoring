# Applies the tag combinations the Endpoint data model's Processes and
# Registry objects require (see eventtypes.conf's comment for the exact
# source -- Splunk_SA_CIM/default/data/models/Endpoint.json's per-object
# "comment.tags" list) to the eventtypes defined in this app's
# eventtypes.conf.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_ingest_pipeline/local/tags.conf

[eventtype=ingest_pipeline_sysmon_process_creation]
process = enabled
report = enabled

[eventtype=ingest_pipeline_sysmon_registry]
endpoint = enabled
registry = enabled
