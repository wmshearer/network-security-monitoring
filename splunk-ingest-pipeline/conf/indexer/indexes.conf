# Dedicated indexes for this project, separate from splunk-detection-lab's
# `detection_lab` index (that project is done; this one is not allowed to
# touch it). Two indexes rather than one so the good-config vs naive-config
# comparison in Phase 2 has a clean per-index boundary for event counts and
# license-usage accounting, in addition to the sourcetype split.
#
# Deployed to: /home/kali/splunk/etc/apps/splunk_ingest_pipeline/local/indexes.conf
[ingest_lab]
homePath   = $SPLUNK_DB/ingest_lab/db
coldPath   = $SPLUNK_DB/ingest_lab/colddb
thawedPath = $SPLUNK_DB/ingest_lab/thaweddb
maxTotalDataSizeMB = 2048
# Source data (Windows Security.json evtx-baseline capture) is dated 2022;
# same reasoning as splunk-detection-lab's indexes.conf: widen so an old
# event timestamp is not silently rejected/re-timestamped.
maxHotSpanSecs = 7776000
frozenTimePeriodInSecs = 315360000

[ingest_lab_naive]
homePath   = $SPLUNK_DB/ingest_lab_naive/db
coldPath   = $SPLUNK_DB/ingest_lab_naive/colddb
thawedPath = $SPLUNK_DB/ingest_lab_naive/thaweddb
maxTotalDataSizeMB = 2048
maxHotSpanSecs = 7776000
frozenTimePeriodInSecs = 315360000
